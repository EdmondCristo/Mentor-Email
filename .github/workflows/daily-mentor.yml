name: Daily mentor email

on:
  schedule:
    # Three emails a day, Eastern time: 8:00 a.m., 1:00 p.m. and 4:00 p.m.
    # Each time is listed twice (summer UTC-4 and winter UTC-5): 12/13, 17/18 and 20/21 UTC.
    # The script reads the clock, sends the email for the current window, and skips any it already sent.
    - cron: "2 12,13,17,18,20,21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, even if that email was already sent (for testing)"
        type: boolean
        default: false
      slot:
        description: "Which email to send (auto = the one for the current time)"
        type: choice
        options: [auto, morning, midday, afternoon]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-mentor
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Write and send today's email
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          B_MODEL: ${{ vars.B_MODEL }}
          WEATHER_PLACE: ${{ vars.WEATHER_PLACE }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          ALLOWED_SENDERS: ${{ vars.ALLOWED_SENDERS }}
          FORCE: ${{ inputs.force }}
          SLOT: ${{ inputs.slot }}
        run: |
          args=""
          if [ "$FORCE" = "true" ]; then args="--force"; fi
          if [ -n "$SLOT" ] && [ "$SLOT" != "auto" ]; then args="$args --slot $SLOT"; fi
          python mentor.py $args

      - name: Save the notebooks
        run: |
          git config user.name "mentor-bot"
          git config user.email "mentor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update mentor notebooks" && git push)
